name: Publication invariants

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  invariants:
    name: Self-containment and publication scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check publication invariants
        run: python3 tools/check_publication_invariants.py
